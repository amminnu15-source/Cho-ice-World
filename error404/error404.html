<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Cho'ice~World</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon" type="image/x-icon" href="/images/Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Baloo+2:wght@500;600;700&family=Pacifico&family=Lobster&display=swap" rel="stylesheet">


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="/error404/error404.css">
</head>
<body>

<div class="e404-page">

    <span class="e404-blob blob-tl"></span>
    <span class="e404-blob blob-br"></span>

    <div class="e404-corner-actions">
        <button id="rtlBtn" class="icon-btn" aria-label="Toggle RTL"><i class="fa-solid fa-right-left"></i></button>
        <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
    </div>

    <a href="/index.html" class="logo e404-logo">
        <img src="/images/Logo.png" alt="Cho'ice~World">
        <div class="logo-text">
            <h2>Cho'ice~World</h2>
            <span>Ice Cream & Milkshakes</span>
        </div>
    </a>

    <div class="e404-inner">

        <h1 class="e404-code">404</h1>
        <h2 class="e404-title">Oops! This Scoop <span>Melted Away</span></h2>
        <p class="e404-desc">
            The page you're looking for doesn't exist, or it's already been
            devoured. Let's get you back to something sweet.
        </p>

        <div class="e404-actions">
            <a href="/index.html" class="e404-btn-primary">
                <i class="fa-solid fa-house"></i>
                Back to Home
            </a>
            <a href="/home-2/home-2.html" class="e404-btn-outline">
                Browse Menu
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

    </div>

</div>

<script src="/error404/error404.js"></script>
</body>
</html>
